name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: snipe-code
          - target: x86_64-pc-windows-gnu
            archive: zip
            binary: snipe-code.exe
          - target: x86_64-apple-darwin
            archive: tar.gz
            binary: snipe-code
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"
      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          stage="stage-${{ matrix.target }}"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
          cp LICENSE README.md "$stage/"
          git rev-parse HEAD > "$stage/SOURCE_REVISION"
          archive="snipe-code-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${archive}.zip" "$stage"/*
          else
            tar -czf "${archive}.tar.gz" -C "$stage" .
          fi
          test -f "${archive}.${{ matrix.archive }}"
          sha256sum "${archive}.${{ matrix.archive }}" > "${archive}.${{ matrix.archive }}.sha256"
          ! find "$stage" -type f \( -name '*.d' -o -name '*.rlib' \)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            snipe-code-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          checksums=(dist/*.sha256)
          (( ${#archives[@]} == 3 ))
          (( ${#checksums[@]} == 3 ))
          sha256sum --check dist/*.sha256
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Sign archives with keyless OIDC
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob --yes --bundle "${archive}.bundle" "$archive"
          done
      - name: Publish verified release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
