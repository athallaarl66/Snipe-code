name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Tag must match the crate version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$version" = "${GITHUB_REF_NAME#v}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Packaging check
        run: cargo publish --dry-run

  targets:
    name: Release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      count: ${{ steps.read.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the release target list
        id: read
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix=$(jq -c '[.targets[] | {target, runner, archive, binary}]' .github/release-targets.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r '.targets | length' .github/release-targets.json)" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.target }})
    needs: [quality, targets]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"
      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          stage="stage-${{ matrix.target }}"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
          cp LICENSE README.md "$stage/"
          git rev-parse HEAD > "$stage/SOURCE_REVISION"
          archive="snipe-code-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${archive}.zip" "$stage"/*
          else
            tar -czf "${archive}.tar.gz" -C "$stage" .
          fi
          test -f "${archive}.${{ matrix.archive }}"
          sha256sum "${archive}.${{ matrix.archive }}" > "${archive}.${{ matrix.archive }}.sha256"
          leaked=$(find "$stage" -type f \( -name '*.d' -o -name '*.rlib' \))
          if [ -n "$leaked" ]; then
            echo "the archive stage must not carry build artifacts: $leaked" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            snipe-code-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    name: Publish release
    needs: [package, targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The expected count and names come from the release target list, so
          # adding or removing a platform needs no edit here.
          expected=${{ needs.targets.outputs.count }}
          archives=(dist/*.tar.gz dist/*.zip)
          checksums=(dist/*.sha256)
          (( ${#archives[@]} == expected ))
          (( ${#checksums[@]} == expected ))
          while read -r target; do
            ls dist | grep -q -- "$target" || { echo "no archive published for $target"; exit 1; }
          done < <(jq -r '.targets[].target' .github/release-targets.json)
          sha256sum --check dist/*.sha256
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Sign archives with keyless OIDC
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob --yes --bundle "${archive}.bundle" "$archive"
            cosign verify-blob --bundle "${archive}.bundle" \
              --certificate-identity-regexp 'https://github.com/.*/.github/workflows/.*' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$archive"
          done
      - name: Publish verified release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  crate:
    name: Publish crate
    # Ordered after the quality gate, so nothing is published while it is red.
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Publish the crate unless the registry already holds this version
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          registry="https://crates.io/api/v1/crates/snipe-code/$version"
          if curl -sf -A 'snipe-code-release-workflow' "$registry" > /dev/null; then
            echo "crates.io already holds snipe-code $version — nothing to publish"
            exit 0
          fi
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; the crate cannot be published" >&2
            exit 1
          fi
          if ! cargo publish --token "$CARGO_REGISTRY_TOKEN"; then
            if curl -sf -A 'snipe-code-release-workflow' "$registry" > /dev/null; then
              echo "another run published snipe-code $version — treating as success"
              exit 0
            fi
            echo "cargo publish failed and the registry does not hold snipe-code $version" >&2
            exit 1
          fi

  image:
    name: Publish container image
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the archive the release ships
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p context
          tar -xzf "dist/snipe-code-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C context
          test -x context/snipe-code
      - name: Build the image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/snipe-code"
          docker build -f Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "SOURCE_REVISION=$(cat context/SOURCE_REVISION)" \
            -t "$image:${GITHUB_REF_NAME}" \
            -t "$image:latest" \
            context
      - name: The image must run
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "ghcr.io/${{ github.repository_owner }}/snipe-code:${GITHUB_REF_NAME}" --version
      - name: Push the image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/snipe-code"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
