name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - run: rustc --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  generated-frontend:
    name: Frontend (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [nextjs, react-vite, vue, nuxtjs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo run --bin verify-generated -- --frontend "${{ matrix.stack }}"

  generated-backend:
    name: Backend (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [nestjs, go-gin, spring-boot, dotnet8, laravel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: actions/setup-node@v4
        if: matrix.stack == 'nestjs'
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        if: matrix.stack == 'go-gin'
        with:
          go-version: '1.21'
      - uses: actions/setup-java@v4
        if: matrix.stack == 'spring-boot'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: matrix.stack == 'dotnet8'
        with:
          dotnet-version: 8.0.x
      - uses: shivammathur/setup-php@v2
        if: matrix.stack == 'laravel'
        with:
          php-version: '8.2'
          tools: composer
      - run: cargo run --bin verify-generated -- --backend "${{ matrix.stack }}"

  compose:
    name: Compose (${{ matrix.database }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgresql
            backend: none
          - database: mysql
            backend: none
          - database: postgresql
            backend: nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: docker --version
      - run: cargo run --bin verify-compose -- "${{ matrix.database }}" "${{ matrix.backend }}"
