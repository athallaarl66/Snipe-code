[package]
name = "snipe-code"
version = "0.5.0"
description = "Rust project scaffolding and heuristic security-audit CLI"
default-run = "snipe-code"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/athallaarl66/Snipe-code"
readme = "README.md"
keywords = ["cli", "scaffolding", "security", "audit", "templates"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
console = "0.15"
printpdf = "0.7"
docx-rs = "0.4"
include_dir = "0.7"
